# ── nginx.conf ──────────────────────────────────────────────────────────────
# HTTP-only. SSL/HTTPS wird von Coolifys Traefik-Proxy terminiert — nginx
# bekommt nur entschlüsselten HTTP-Traffic auf Port 80 weitergereicht.
# (Für ein bare-metal Deployment ohne Coolify müsste hier SSL ergänzt werden.)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy → api container (internes Docker-Netzwerk)
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback — React Router übernimmt das Routing client-seitig
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressives Caching für gehashte statische Assets
    location ~* \.(js|css|woff2|woff|ttf|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nie cachen (immer frisch)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
