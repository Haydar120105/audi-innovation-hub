services:

  # ── API Server (Express + Node.js) ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # x64/glibc — passt zu den im Lockfile behaltenen Binaries (@esbuild/linux-x64)
    # und zur üblichen Coolify-Server-Architektur.
    platform: linux/amd64
    restart: unless-stopped
    # Env-Variablen werden von Coolify injiziert (UI → Environment Variables).
    # Lokal: per `--env-file .env.production` oder Shell-Export bereitstellen.
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      DEPARTMENT_WRITE_SECRET: ${DEPARTMENT_WRITE_SECRET}
    expose:
      - "8000"
    healthcheck:
      # node-basiert (Debian-slim hat kein wget/curl)
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── nginx (static frontend + reverse proxy) ──────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      args:
        # VITE_CLERK_PUBLISHABLE_KEY wird zur Build-Zeit ins JS-Bundle gebacken.
        # In Coolify als Build-Variable setzen (pk_live_... für Produktion).
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    # x64/glibc — passt zu @rollup/rollup-linux-x64-gnu im Lockfile.
    platform: linux/amd64
    restart: unless-stopped
    # Coolifys Traefik-Proxy übernimmt 80/443 + SSL — nginx exposed nur intern.
    # Domain dem nginx-Service (Port 80) in der Coolify-UI zuweisen.
    expose:
      - "80"
    volumes:
      # nginx-Config gemountet (nicht gebacken) — erlaubt Hot-Swap ohne Rebuild
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
